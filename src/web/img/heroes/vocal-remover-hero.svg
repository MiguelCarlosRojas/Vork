<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="vrBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="vrBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007b" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff7a3d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="vrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="vrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="200" cy="220" r="130" fill="#ff007b" opacity="0.14" filter="url(#vrGlow)" />
  <circle cx="320" cy="280" r="130" fill="#00f0ff" opacity="0.14" filter="url(#vrGlow)" />

  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#vrBgGrad)" stroke="url(#vrBorderGrad)" stroke-width="4" filter="url(#vrShadow)" />

  <!-- Waveform Splitting Diagram -->
  <g filter="url(#vrShadow)">
    <!-- Top Track: Vocals (Acapella / Magenta) -->
    <rect x="110" y="145" width="292" height="70" rx="16" ry="16" fill="#24141d" stroke="#ff007b" stroke-width="2.5" />
    <g fill="#ff007b" opacity="0.9">
      <rect x="135" y="165" width="4" height="30" rx="2" />
      <rect x="145" y="155" width="4" height="50" rx="2" />
      <rect x="155" y="160" width="4" height="40" rx="2" />
      <rect x="165" y="170" width="4" height="20" rx="2" />
      <rect x="175" y="152" width="4" height="56" rx="2" />
      <rect x="185" y="162" width="4" height="36" rx="2" />
      <rect x="195" y="158" width="4" height="44" rx="2" />
      <rect x="205" y="168" width="4" height="24" rx="2" />
      <rect x="215" y="154" width="4" height="52" rx="2" />
      <rect x="225" y="164" width="4" height="32" rx="2" />
    </g>
    <text x="320" y="188" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#f4ece1">VOCAL</text>

    <!-- Separation Scissors / Split Node -->
    <circle cx="256" cy="245" r="20" fill="#14100d" stroke="#f4ece1" stroke-width="3" filter="url(#vrGlow)" />
    <path d="M 248,237 L 264,253 M 264,237 L 248,253" stroke="#ff7a3d" stroke-width="3" stroke-linecap="round" />

    <!-- Bottom Track: Instrumental (Karaoke / Cyan) -->
    <rect x="110" y="275" width="292" height="70" rx="16" ry="16" fill="#132026" stroke="#00f0ff" stroke-width="2.5" />
    <g fill="#00f0ff" opacity="0.9">
      <rect x="135" y="295" width="4" height="30" rx="2" />
      <rect x="145" y="285" width="4" height="50" rx="2" />
      <rect x="155" y="300" width="4" height="20" rx="2" />
      <rect x="165" y="282" width="4" height="56" rx="2" />
      <rect x="175" y="292" width="4" height="36" rx="2" />
      <rect x="185" y="288" width="4" height="44" rx="2" />
      <rect x="195" y="298" width="4" height="24" rx="2" />
      <rect x="205" y="284" width="4" height="52" rx="2" />
      <rect x="215" y="294" width="4" height="32" rx="2" />
      <rect x="225" y="286" width="4" height="48" rx="2" />
    </g>
    <text x="320" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#00f0ff">MUSIC</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(256, 395)" filter="url(#vrShadow)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" ry="18" fill="#1b1613" stroke="#ff007b" stroke-width="1.8" />
    <circle cx="-60" cy="0" r="5" fill="#ff007b">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">STEMS • 2-TRACK</text>
  </g>
</svg>
