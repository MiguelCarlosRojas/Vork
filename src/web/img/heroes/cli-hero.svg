<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cliBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="cliBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#a99cff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="cliGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cliShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="256" cy="240" r="130" fill="#ff7a3d" opacity="0.14" filter="url(#cliGlow)" />
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#cliBgGrad)" stroke="url(#cliBorderGrad)" stroke-width="4" filter="url(#cliShadow)" />

  <!-- Terminal Window Console Core -->
  <g filter="url(#cliShadow)">
    <rect x="125" y="140" width="262" height="175" rx="18" ry="18" fill="#15110e" stroke="#ff7a3d" stroke-width="3" />
    <!-- Terminal Header Bar -->
    <path d="M 125,175 L 387,175" stroke="#ff7a3d" stroke-width="1.5" opacity="0.4" />
    <!-- Window Control Dots -->
    <circle cx="150" cy="158" r="4.5" fill="#ff5f56" />
    <circle cx="166" cy="158" r="4.5" fill="#ffbd2e" />
    <circle cx="182" cy="158" r="4.5" fill="#27c93f" />

    <!-- Prompt text: vork run --agent -->
    <text x="148" y="215" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="15" font-weight="700" fill="#f4ece1">&gt; vork run</text>
    <text x="148" y="245" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#ff7a3d">[+] 9 pillars online</text>
    <!-- Blinking Cursor -->
    <rect x="148" y="260" width="10" height="16" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Status Pill -->
  <g transform="translate(256, 395)" filter="url(#cliShadow)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" ry="18" fill="#1b1613" stroke="#ff7a3d" stroke-width="1.8" />
    <circle cx="-60" cy="0" r="5" fill="#ff7a3d">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">CLI • 9 PILLARS</text>
  </g>
</svg>
