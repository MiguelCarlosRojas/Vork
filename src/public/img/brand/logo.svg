<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="vorkBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="vorkBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff9e6b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a99cff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Right Wing Gradient -->
    <linearGradient id="vorkRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5e1e" />
      <stop offset="60%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#ffa173" />
    </linearGradient>

    <!-- Facet Highlight Gradient -->
    <linearGradient id="vorkFacetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffcbb0" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="vorkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="vorkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow in Background -->
  <circle cx="256" cy="270" r="140" fill="#ff7a3d" opacity="0.12" filter="url(#vorkGlow)" />

  <!-- Squircle Base Badge -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#vorkBgGrad)" stroke="url(#vorkBorderGrad)" stroke-width="4" filter="url(#vorkShadow)" />

  <!-- The Vork "V" Monogram -->
  <g filter="url(#vorkShadow)">
    <!-- Left Wing (Cream / Architectural Warm Tone) -->
    <polygon points="135,145 185,145 256,315 256,380 222,380" fill="#f4ece1" />

    <!-- Right Wing Main Body (Vibrant Coral Orange) -->
    <polygon points="256,380 256,310 332,145 377,145" fill="url(#vorkRightGrad)" />

    <!-- Right Wing Dimensional Bevel Facet -->
    <polygon points="256,380 256,345 355,145 377,145" fill="url(#vorkFacetGrad)" />
  </g>

  <!-- Multimodal Neural Spark (Orbital Node) -->
  <g>
    <!-- Aura -->
    <circle cx="382" cy="125" r="24" fill="#ff7a3d" opacity="0.35" filter="url(#vorkGlow)" />
    <!-- Outer Ring -->
    <circle cx="382" cy="125" r="14" fill="#fff5ee" />
    <!-- Core -->
    <circle cx="382" cy="125" r="9" fill="#ff7a3d" />
  </g>
</svg>
