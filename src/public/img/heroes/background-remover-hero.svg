<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgRemBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="bgRemBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff7a3d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f4ece1" stop-opacity="0.6" />
    </linearGradient>
    <pattern id="checkerGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#2d2235" />
      <rect x="10" width="10" height="10" fill="#1b1422" />
      <rect y="10" width="10" height="10" fill="#1b1422" />
      <rect x="10" y="10" width="10" height="10" fill="#2d2235" />
    </pattern>
    <filter id="bgRemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="bgRemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="256" cy="240" r="130" fill="#c084fc" opacity="0.14" filter="url(#bgRemGlow)" />
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#bgRemBgGrad)" stroke="url(#bgRemBorderGrad)" stroke-width="4" filter="url(#bgRemShadow)" />

  <!-- Cutout & Transparency Canvas -->
  <g filter="url(#bgRemShadow)">
    <!-- Canvas Card with Transparency Checkerboard -->
    <rect x="140" y="140" width="232" height="175" rx="20" ry="20" fill="url(#checkerGrid)" stroke="#c084fc" stroke-width="3" />

    <!-- Isolated Subject Silhouette (Person with glowing AI mask) -->
    <!-- Head -->
    <circle cx="256" cy="205" r="28" fill="#f4ece1" filter="url(#bgRemGlow)" />
    <!-- Shoulders / Torso -->
    <path d="M 210,290 C 210,248 302,248 302,290 Z" fill="#ff7a3d" />

    <!-- Magic Cutout Wand -->
    <g transform="translate(325, 145) rotate(45)">
      <rect x="-4" y="-2" width="8" height="50" rx="4" fill="#f4ece1" stroke="#c084fc" stroke-width="2" />
      <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" fill="#c084fc" filter="url(#bgRemGlow)" />
    </g>
  </g>

  <!-- Sparkles -->
  <circle cx="165" cy="180" r="4" fill="#c084fc" />
  <circle cx="340" cy="260" r="5" fill="#ff7a3d" />

  <!-- Status Pill -->
  <g transform="translate(256, 395)" filter="url(#bgRemShadow)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" ry="18" fill="#1b1613" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="-60" cy="0" r="5" fill="#c084fc">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">AI STUDIO • CLEAR</text>
  </g>
</svg>
