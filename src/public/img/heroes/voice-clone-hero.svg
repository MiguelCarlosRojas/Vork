<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="vcBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="vcBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff7a3d" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ff7a3d" />
    </linearGradient>
    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f4ece1" />
    </linearGradient>
    <filter id="vcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="vcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="140" fill="#c084fc" opacity="0.14" filter="url(#vcGlow)" />
  <circle cx="200" cy="200" r="110" fill="#ff7a3d" opacity="0.12" filter="url(#vcGlow)" />

  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#vcBgGrad)" stroke="url(#vcBorderGrad)" stroke-width="4" filter="url(#vcShadow)" />

  <!-- Vocal Timbre Frequency Wave Grid -->
  <g opacity="0.25" stroke="#c084fc" stroke-width="1.5" fill="none">
    <ellipse cx="256" cy="256" rx="160" ry="160" stroke-dasharray="8,8" />
    <path d="M 120,256 Q 188,180 256,256 T 392,256" />
    <path d="M 120,256 Q 188,332 256,256 T 392,256" />
  </g>

  <!-- Vocal DNA / Neural Soundprint Core -->
  <g filter="url(#vcShadow)">
    <!-- DNA Crossbars & Nodes -->
    <g stroke="#f4ece1" stroke-width="2.5" opacity="0.6">
      <line x1="200" y1="160" x2="312" y2="160" />
      <line x1="220" y1="200" x2="292" y2="200" />
      <line x1="256" y1="240" x2="256" y2="240" stroke-width="8" stroke="#ff7a3d" stroke-linecap="round" />
      <line x1="220" y1="280" x2="292" y2="280" />
      <line x1="200" y1="320" x2="312" y2="320" />
    </g>

    <!-- Strand 1 (Voice Timbre Extraction) -->
    <path d="M 200,140 C 210,180 310,210 312,256 C 310,300 210,330 200,370" fill="none" stroke="url(#dnaGrad1)" stroke-width="5" stroke-linecap="round" />
    <!-- Strand 2 (F0 Pitch Reconstruction) -->
    <path d="M 312,140 C 300,180 200,210 200,256 C 200,300 300,330 312,370" fill="none" stroke="url(#dnaGrad2)" stroke-width="5" stroke-linecap="round" />

    <!-- Junction Nodes -->
    <circle cx="200" cy="160" r="7" fill="#c084fc" />
    <circle cx="312" cy="160" r="7" fill="#ff7a3d" />
    <circle cx="256" cy="256" r="9" fill="#f4ece1" filter="url(#vcGlow)" />
    <circle cx="200" cy="320" r="7" fill="#38bdf8" />
    <circle cx="312" cy="320" r="7" fill="#c084fc" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(256, 395)" filter="url(#vcShadow)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" ry="18" fill="#1b1613" stroke="#c084fc" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="5" fill="#c084fc">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">VOICE • CLONE</text>
  </g>
</svg>
