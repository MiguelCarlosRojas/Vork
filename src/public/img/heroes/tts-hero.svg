<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="ttsBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="ttsBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff7a3d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a99cff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="ttsWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a3d" />
      <stop offset="50%" stop-color="#f4ece1" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="ttsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="ttsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="150" fill="#00f0ff" opacity="0.12" filter="url(#ttsGlow)" />
  <circle cx="360" cy="180" r="100" fill="#ff7a3d" opacity="0.14" filter="url(#ttsGlow)" />

  <!-- Squircle Base Badge -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#ttsBgGrad)" stroke="url(#ttsBorderGrad)" stroke-width="4" filter="url(#ttsShadow)" />

  <!-- Audio Wave Orbit Background -->
  <g opacity="0.25" stroke="#00f0ff" stroke-width="1.5" fill="none">
    <ellipse cx="256" cy="256" rx="160" ry="60" transform="rotate(-15 256 256)" stroke-dasharray="6,6" />
  </g>

  <!-- Microphone / Sound Source Hologram -->
  <g filter="url(#ttsShadow)">
    <!-- Central Speaker / Voice Capsule -->
    <rect x="220" y="145" width="72" height="130" rx="36" ry="36" fill="#1b1614" stroke="#ff7a3d" stroke-width="4" />
    <!-- Capsule Mesh Lines -->
    <line x1="235" y1="180" x2="277" y2="180" stroke="#f4ece1" stroke-width="2" opacity="0.6" />
    <line x1="235" y1="205" x2="277" y2="205" stroke="#f4ece1" stroke-width="2" opacity="0.6" />
    <line x1="235" y1="230" x2="277" y2="230" stroke="#f4ece1" stroke-width="2" opacity="0.6" />

    <!-- U-Shape Cradle Support -->
    <path d="M 198,220 C 198,285 314,285 314,220" fill="none" stroke="#a99cff" stroke-width="4" stroke-linecap="round" />
    <!-- Stand Neck & Base -->
    <line x1="256" y1="285" x2="256" y2="330" stroke="#a99cff" stroke-width="5" stroke-linecap="round" />
    <ellipse cx="256" cy="334" rx="42" ry="12" fill="#241c18" stroke="#ff7a3d" stroke-width="3" />
  </g>

  <!-- Multi-Frequency Neural Soundwaves -->
  <g stroke="url(#ttsWaveGrad)" stroke-width="3.5" stroke-linecap="round" opacity="0.9" filter="url(#ttsGlow)">
    <!-- Left Waves -->
    <path d="M 175,200 Q 155,225 175,250" fill="none" />
    <path d="M 150,185 Q 120,225 150,265" fill="none" stroke-width="3" opacity="0.7" />
    <path d="M 125,170 Q 85,225 125,280" fill="none" stroke-width="2.5" opacity="0.5" />

    <!-- Right Waves -->
    <path d="M 337,200 Q 357,225 337,250" fill="none" />
    <path d="M 362,185 Q 392,225 362,265" fill="none" stroke-width="3" opacity="0.7" />
    <path d="M 387,170 Q 427,225 387,280" fill="none" stroke-width="2.5" opacity="0.5" />
  </g>

  <!-- Speed & Status Badge -->
  <g transform="translate(256, 385)" filter="url(#ttsShadow)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" ry="18" fill="#1b1613" stroke="#00f0ff" stroke-width="1.8" />
    <circle cx="-56" cy="0" r="5" fill="#00f0ff">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">TTS • NEURAL</text>
  </g>
</svg>
