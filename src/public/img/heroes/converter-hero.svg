<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="cnvBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>
    <linearGradient id="cnvBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ff7a3d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="mediaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#ff7a3d" />
    </linearGradient>
    <filter id="cnvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cnvShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <circle cx="256" cy="256" r="140" fill="#ef4444" opacity="0.12" filter="url(#cnvGlow)" />
  <circle cx="340" cy="190" r="110" fill="#00f0ff" opacity="0.12" filter="url(#cnvGlow)" />

  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#cnvBgGrad)" stroke="url(#cnvBorderGrad)" stroke-width="4" filter="url(#cnvShadow)" />

  <!-- Media Conversion Rings -->
  <g opacity="0.25" stroke="#ef4444" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="160" stroke-dasharray="8,6" />
  </g>

  <!-- Universal Media Engine Core -->
  <g filter="url(#cnvShadow)">
    <!-- MP4 Video Player Slate -->
    <rect x="140" y="150" width="232" height="150" rx="20" ry="20" fill="#1d1614" stroke="#ff7a3d" stroke-width="3.5" />
    <path d="M 140,195 L 372,195" stroke="#ff7a3d" stroke-width="1.5" opacity="0.4" />
    <!-- Film Strip Dots -->
    <circle cx="165" cy="172" r="5" fill="#f4ece1" opacity="0.7" />
    <circle cx="195" cy="172" r="5" fill="#f4ece1" opacity="0.7" />
    <circle cx="225" cy="172" r="5" fill="#f4ece1" opacity="0.7" />

    <!-- Play Button Triangle inside video -->
    <polygon points="245,230 245,260 275,245" fill="#ef4444" />
  </g>

  <!-- Floating Format Badges -->
  <!-- MP3 Audio Badge -->
  <g transform="translate(145, 335)" filter="url(#cnvShadow)">
    <rect x="-45" y="-20" width="90" height="40" rx="12" ry="12" fill="#241b18" stroke="#ff7a3d" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#f4ece1" text-anchor="middle">MP3</text>
  </g>

  <!-- MP4 Video Badge -->
  <g transform="translate(367, 335)" filter="url(#cnvShadow)">
    <rect x="-45" y="-20" width="90" height="40" rx="12" ry="12" fill="#182329" stroke="#00f0ff" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#00f0ff" text-anchor="middle">MP4</text>
  </g>

  <!-- Bidirectional Conversion Flow Arrows -->
  <path d="M 205,335 L 305,335" stroke="#f4ece1" stroke-width="3" stroke-dasharray="4,4" />
  <polygon points="305,330 315,335 305,340" fill="#f4ece1" />

  <!-- Status Pill -->
  <g transform="translate(256, 400)" filter="url(#cnvShadow)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" ry="18" fill="#1b1613" stroke="#ff7a3d" stroke-width="1.8" />
    <circle cx="-60" cy="0" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="8" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">UNIVERSAL • HD</text>
  </g>
</svg>
