<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="trBgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#261d18" />
      <stop offset="60%" stop-color="#14100d" />
      <stop offset="100%" stop-color="#090706" />
    </radialGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="trBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff9e6b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a99cff" stop-opacity="0.5" />
    </linearGradient>

    <!-- Cloud Glow and Neural Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff915b" />
      <stop offset="50%" stop-color="#ff7a3d" />
      <stop offset="100%" stop-color="#e04e10" />
    </linearGradient>

    <linearGradient id="cloudInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a201a" />
      <stop offset="100%" stop-color="#181310" />
    </linearGradient>

    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f4ece1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a99cff" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="tokenGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#342820" />
      <stop offset="100%" stop-color="#1d1612" />
    </linearGradient>

    <linearGradient id="tokenGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2335" />
      <stop offset="100%" stop-color="#171321" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="trGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="trSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="trShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow in Background -->
  <circle cx="256" cy="256" r="150" fill="#ff7a3d" opacity="0.14" filter="url(#trGlow)" />
  <circle cx="360" cy="180" r="100" fill="#a99cff" opacity="0.12" filter="url(#trGlow)" />

  <!-- Squircle Base Badge (Huella Container) -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="url(#trBgGrad)" stroke="url(#trBorderGrad)" stroke-width="4" filter="url(#trShadow)" />

  <!-- Globe / Network Wireframe Rings -->
  <g opacity="0.25" stroke="#a99cff" stroke-width="1.5" fill="none">
    <ellipse cx="256" cy="256" rx="155" ry="155" stroke-dasharray="6,6" />
    <ellipse cx="256" cy="256" rx="155" ry="58" />
    <ellipse cx="256" cy="256" rx="58" ry="155" />
    <line x1="101" y1="256" x2="411" y2="256" />
    <line x1="256" y1="101" x2="256" y2="411" />
  </g>

  <!-- Orbital Data Synapse (Flow Rings) -->
  <ellipse cx="256" cy="256" rx="170" ry="72" fill="none" stroke="url(#beamGrad)" stroke-width="3" transform="rotate(-24 256 256)" opacity="0.75" filter="url(#trSoftGlow)" />

  <!-- Central Cloud Engine Body -->
  <g filter="url(#trShadow)">
    <!-- Cloud Silhouette Glow -->
    <path d="M 195,305 L 320,305 C 348,305 372,284 372,256 C 372,232 355,212 332,208 C 328,172 297,144 258,144 C 226,144 198,162 188,190 C 182,188 175,187 168,187 C 141,187 119,209 119,236 C 119,261 138,282 163,285 C 166,296 179,305 195,305 Z"
          fill="url(#cloudInnerGrad)" stroke="url(#cloudGrad)" stroke-width="5" stroke-linejoin="round" />

    <!-- Neural Internal Nodes inside Cloud -->
    <g stroke="#ff7a3d" stroke-width="2" opacity="0.7" fill="none">
      <line x1="210" y1="240" x2="256" y2="200" />
      <line x1="256" y1="200" x2="302" y2="240" />
      <line x1="210" y1="240" x2="256" y2="265" />
      <line x1="302" y1="240" x2="256" y2="265" />
      <line x1="256" y1="200" x2="256" y2="265" />
    </g>

    <!-- Node Junction Points -->
    <circle cx="210" cy="240" r="5" fill="#f4ece1" />
    <circle cx="302" cy="240" r="5" fill="#ff7a3d" />
    <circle cx="256" cy="200" r="6" fill="#a99cff" />
    <circle cx="256" cy="265" r="7" fill="#ff7a3d" filter="url(#trSoftGlow)" />
  </g>

  <!-- Left Hologram Badge: Source "A" (Latin / Universal) -->
  <g transform="translate(112, 196)" filter="url(#trShadow)">
    <rect x="-32" y="-32" width="64" height="64" rx="16" ry="16" fill="url(#tokenGradLeft)" stroke="#ff7a3d" stroke-width="2.5" />
    <text x="0" y="11" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#f4ece1" text-anchor="middle">A</text>
    <circle cx="24" cy="-24" r="5" fill="#ff7a3d" />
  </g>

  <!-- Right Hologram Badge: Target "文" (Linguistic Core / +200 Languages) -->
  <g transform="translate(400, 316)" filter="url(#trShadow)">
    <rect x="-32" y="-32" width="64" height="64" rx="16" ry="16" fill="url(#tokenGradRight)" stroke="#a99cff" stroke-width="2.5" />
    <text x="0" y="12" font-family="'Plus Jakarta Sans', 'Noto Sans CJK SC', 'PingFang SC', sans-serif" font-size="32" font-weight="700" fill="#ff9e6b" text-anchor="middle">文</text>
    <circle cx="-24" cy="-24" r="5" fill="#a99cff" />
  </g>

  <!-- Dynamic Translation Arrows / Synapse Arc -->
  <path d="M 152,210 Q 256,120 365,295" fill="none" stroke="url(#beamGrad)" stroke-width="3.5" stroke-dasharray="8,6" opacity="0.85" filter="url(#trSoftGlow)" />
  <path d="M 360,335 Q 256,410 148,230" fill="none" stroke="url(#cloudGrad)" stroke-width="2.5" stroke-dasharray="6,6" opacity="0.75" />

  <!-- Speed & Real-time Indicator Badge -->
  <g transform="translate(256, 368)" filter="url(#trShadow)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" ry="18" fill="#1b1613" stroke="#ff7a3d" stroke-width="1.8" />
    <circle cx="-48" cy="0" r="5" fill="#ff7a3d">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="6" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#f4ece1" text-anchor="middle">0ms • CLOUD</text>
  </g>

  <!-- Multimodal Neural Sparks -->
  <g>
    <circle cx="390" cy="118" r="4" fill="#f4ece1" opacity="0.8" />
    <circle cx="120" cy="370" r="3.5" fill="#ff7a3d" opacity="0.8" />
    <circle cx="256" cy="95" r="5" fill="#a99cff" opacity="0.9" />
    <polygon points="360,140 363,148 371,151 363,154 360,162 357,154 349,151 357,148" fill="#ff7a3d" opacity="0.75" />
    <polygon points="150,330 152,336 158,338 152,340 150,346 148,340 142,338 148,336" fill="#f4ece1" opacity="0.7" />
  </g>
</svg>
