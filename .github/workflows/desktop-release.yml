name: Vork Desktop Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Compilar Vork Desktop (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r vork-desktop/requirements.txt
          pip install pyinstaller

      - name: Compilar Ejecutable Vork con PyInstaller
        run: |
          cd vork-desktop
          python -m PyInstaller --noconfirm --onedir --windowed --name="Vork-Desktop" --icon="assets/icons/vork.ico" --add-data="assets;assets" main.py

      - name: Empaquetar Distribución Portable en ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "vork-desktop/dist/Vork-Desktop/*" -DestinationPath "vork-desktop/dist/Vork-Desktop-Windows-x64.zip"

      - name: Publicar Release Oficial en GitHub Tags
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Vork Desktop ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            vork-desktop/dist/Vork-Desktop-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
